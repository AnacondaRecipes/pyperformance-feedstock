{% set name = "pyperformance" %}
{% set version = "1.14.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/python/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 2eb90812292522297bb046e589e0876c00ec5b5f49e8653eca39f8fd942840ed

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - pyperformance=pyperformance.cli:main
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=61
    - wheel
  run:
    - python
    - packaging
    - pyperf
    - tomli  # [py<311]

# FullStackTests trying to create venv, and dev.py needs to be added to the site-pkg dir. Just skip tests with dev.py. Don`t want increase sp_dir.
{% set deselect_tests = " --deselect=test_commands.py::FullStackTests" %}
#E       -                   _base_executable='$PREFIX/bin/python3.12',
#E       +                   _base_executable='/private$PREFIX/bin/python3.12',
#E       ?                                     ++++++++
{% set deselect_tests = deselect_tests + " --deselect=test_pythoninfo.py::GetInfoTests::test_venv" %}  # [osx]

test:
  imports:
    - pyperformance
    - pyperformance.cli
    - pyperformance.commands
    - pyperformance.venv
  commands:
    - pip check
    - pyperformance --help
    - pytest --pyargs pyperformance.tests {{ deselect_tests }}
  requires:
    - pip
    - pytest

about:
  home: https://github.com/python/pyperformance
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Python benchmark suite
  description: |
    The pyperformance project is intended to be an authoritative source of benchmarks for all Python implementations.
    The focus is on real-world benchmarks, rather than synthetic benchmarks, using whole applications when possible.
  doc_url: https://pyperformance.readthedocs.io
  dev_url: https://github.com/python/pyperformance

extra:
  recipe-maintainers:
    - mingwandroid
